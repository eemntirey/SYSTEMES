<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="80%">
      <stop offset="0%" stop-color="#dff0ff"/>
      <stop offset="45%" stop-color="#bcd9f7"/>
      <stop offset="100%" stop-color="#8fb6e6"/>
    </radialGradient>

    <linearGradient id="petalA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4aa8ef" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2f6fd0" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#1b4a9c" stop-opacity="0.25"/>
