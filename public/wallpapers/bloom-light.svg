      <stop offset="0%" stop-color="#5f9ff0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#22539f" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
