<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="88%">
      <stop offset="0%" stop-color="#1a4a86"/>
      <stop offset="38%" stop-color="#0e2d59"/>
      <stop offset="100%" stop-color="#050f21"/>
    </radialGradient>

    <linearGradient id="pV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#cdefff"/>
      <stop offset="40%" stop-color="#57a6f2"/>
      <stop offset="100%" stop-color="#14418f"/>
    </linearGradient>
    <linearGradient id="pVr" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#cdefff"/>
      <stop offset="40%" stop-color="#57a6f2"/>
      <stop offset="100%" stop-color="#14418f"/>
    </linearGradient>
    <linearGradient id="pH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#14418f"/>
      <stop offset="50%" stop-color="#57a6f2"/>
      <stop offset="100%" stop-color="#cdefff"/>
    </linearGradient>
    <linearGradient id="pHl" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#14418f"/>
      <stop offset="50%" stop-color="#57a6f2"/>
      <stop offset="100%" stop-color="#cdefff"/>
    </linearGradient>
    <linearGradient id="pD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7e2ff"/>
      <stop offset="100%" stop-color="#1c4d99"/>
    </linearGradient>

    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blurXL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="75"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>

  <!-- Halo ambiant -->
  <ellipse cx="1280" cy="720" rx="700" ry="560" fill="#2f7fd6" opacity="0.30" filter="url(#blurXL)"/>
  <ellipse cx="1280" cy="720" rx="420" ry="360" fill="#6fc6ff" opacity="0.20" filter="url(#blurXL)"/>

  <g transform="translate(1280 720)">
    <!-- Couche arrière : 4 grands pétales flous (profondeur) -->
    <g filter="url(#blurL)" opacity="0.85">
      <path d="M0 0 C-95 -170 -105 -360 0 -520 C105 -360 95 -170 0 0 Z" fill="url(#pV)"/>
      <path d="M0 0 C-95 170 -105 360 0 520 C105 360 95 170 0 0 Z" fill="url(#pVr)"/>
      <path d="M0 0 C-170 -95 -360 -105 -520 0 C-360 105 -170 95 0 0 Z" fill="url(#pHl)"/>
      <path d="M0 0 C170 -95 360 -105 520 0 C360 105 170 95 0 0 Z" fill="url(#pH)"/>
    </g>

    <!-- Couche diagonale -->
    <g filter="url(#blurM)" opacity="0.9" transform="rotate(45)">
      <path d="M0 0 C-88 -160 -96 -350 0 -500 C96 -350 88 -160 0 0 Z" fill="url(#pD)"/>
      <path d="M0 0 C-88 160 -96 350 0 500 C96 350 88 160 0 0 Z" fill="url(#pD)"/>
      <path d="M0 0 C-160 -88 -350 -96 -500 0 C-350 96 -160 88 0 0 Z" fill="url(#pD)"/>
      <path d="M0 0 C160 -88 350 -96 500 0 C350 96 160 88 0 0 Z" fill="url(#pD)"/>
    </g>

    <!-- Couche avant : 4 pétales nets -->
    <g filter="url(#blurS)">
      <path d="M0 0 C-72 -150 -80 -340 0 -490 C80 -340 72 -150 0 0 Z" fill="url(#pV)"/>
      <path d="M0 0 C-72 150 -80 340 0 490 C80 340 72 150 0 0 Z" fill="url(#pVr)"/>
      <path d="M0 0 C-150 -72 -340 -80 -490 0 C-340 80 -150 72 0 0 Z" fill="url(#pHl)"/>
      <path d="M0 0 C150 -72 340 -80 490 0 C340 80 150 72 0 0 Z" fill="url(#pH)"/>
    </g>

    <!-- Cœur -->
    <circle r="130" fill="#8dd8ff" opacity="0.45" filter="url(#blurL)"/>
    <circle r="52" fill="#d6f0ff" opacity="0.85" filter="url(#blurM)"/>
    <circle r="20" fill="#ffffff" opacity="0.95" filter="url(#blurS)"/>
  </g>

  <rect width="2560" height="1440" fill="#04101f" opacity="0.08"/>
</svg>
