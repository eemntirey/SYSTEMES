name: CI

on:
  push:
    branches:
      - main
      - feat/systemes-modernisation-apps
      - Osreell
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  windows-native-host:
    name: Windows native host build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install frontend dependencies
        run: npm ci
      - name: Build React assets
        run: npm run build
      - name: Build WPF + WebView2 host and native engine
        run: dotnet build native/windows-host/SYSTEMES.WindowsHost.csproj --configuration Release
      - name: Smoke test native engine JSON handshake
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE "native/windows-host/bin/Release/net8.0-windows/native-engine/SystemesNative.exe"
          if (-not (Test-Path $engine)) {
            throw "Native engine executable missing: $engine"
          }

          $request = '{"id":"ci-smoke","method":"system/ping","params":{}}'
          $responseLines = $request | & $engine
          if ($LASTEXITCODE -ne 0) {
            throw "Native engine exited with code $LASTEXITCODE"
          }

          $response = ($responseLines -join "`n") | ConvertFrom-Json
          if ($response.id -ne "ci-smoke" -or $response.result.status -ne "ready") {
            throw "Unexpected native engine handshake response: $($responseLines -join ' ')"
          }

          Write-Host "Native engine process started and answered the JSON handshake."

      - name: Exercise native read operations and temporary file lifecycle
        shell: pwsh
        run: |
          $engine = Join-Path $env:GITHUB_WORKSPACE "native/windows-host/bin/Release/net8.0-windows/native-engine/SystemesNative.exe"
          $testRoot = Join-Path $env:RUNNER_TEMP ("systemes-phase2-" + [guid]::NewGuid().ToString("N"))
          $testFile = Join-Path $testRoot "bridge-smoke.txt"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          try {
            $requests = @(
              @{ id = "phase2-ping"; method = "system/ping"; params = @{} },
              @{ id = "phase2-hardware"; method = "hardware/read"; params = @{} },
              @{ id = "phase2-processes"; method = "processes/read"; params = @{} },
              @{ id = "phase2-devices"; method = "devices/read"; params = @{} },
              @{ id = "phase2-update"; method = "update/check"; params = @{} },
              @{ id = "phase2-file-create"; method = "files/create"; params = @{ path = $testFile; content = "SYSTEMES native integration test" } },
              @{ id = "phase2-file-read"; method = "files/read"; params = @{ path = $testFile } },
              @{ id = "phase2-file-delete"; method = "files/delete"; params = @{ path = $testFile } },
              @{ id = "phase2-unknown"; method = "phase2/unknown"; params = @{} }
            )
            $requestLines = $requests | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 8 }
            $responseLines = $requestLines | & $engine
            if ($LASTEXITCODE -ne 0) {
              throw "Native engine exited with code $LASTEXITCODE during phase 2 integration tests."
            }
            if ($responseLines.Count -ne $requests.Count) {
              throw "Expected $($requests.Count) native responses, received $($responseLines.Count)."
            }

            $responses = @{}
            foreach ($line in $responseLines) {
              $response = $line | ConvertFrom-Json
              $responses[$response.id] = $response
            }
            foreach ($request in $requests) {
              if (-not $responses.ContainsKey($request.id)) {
                throw "Missing native response for request $($request.id)."
              }
            }

            if ($responses["phase2-ping"].result.status -ne "ready") { throw "system/ping failed." }
            if (-not $responses["phase2-hardware"].result.note) { throw "hardware/read returned no diagnostic result." }
            if ($null -eq $responses["phase2-processes"].result.processes) { throw "processes/read returned no process collection." }
            if ($null -eq $responses["phase2-devices"].result.usb -or $null -eq $responses["phase2-devices"].result.network) { throw "devices/read returned an incomplete result." }
            if (-not $responses["phase2-update"].result.note) { throw "update/check returned no diagnostic result." }
            if ($responses["phase2-file-create"].result.created -ne $true) { throw "files/create failed." }
            if ($responses["phase2-file-read"].result.exists -ne $true) { throw "files/read did not find the created file." }
            if ($responses["phase2-file-delete"].result.deleted -ne $true) { throw "files/delete failed." }
            if (-not $responses["phase2-unknown"].error) { throw "Unknown native methods must return a top-level protocol error." }
            if (Test-Path $testFile) { throw "Temporary native test file was not deleted." }

            Write-Host "Phase 2 native integration checks passed: hardware, processes, devices, update status, file lifecycle, and protocol errors."
          }
          finally {
            Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Launch WPF host and verify WebView2 React rendering
        shell: pwsh
        run: |
          $hostExe = Join-Path $env:GITHUB_WORKSPACE "native/windows-host/bin/Release/net8.0-windows/SYSTEMES.WindowsHost.exe"
          $resultPath = Join-Path $env:RUNNER_TEMP "systemes-ui-smoke.json"
          $screenshotPath = Join-Path $env:GITHUB_WORKSPACE "systemes-ui-smoke.png"
          if (-not (Test-Path $hostExe)) {
            throw "WPF host executable missing: $hostExe"
          }

          Remove-Item $resultPath -Force -ErrorAction SilentlyContinue
          $env:SYSTEMES_UI_SMOKE_RESULT = $resultPath
          $hostProcess = Start-Process -FilePath $hostExe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            while (-not (Test-Path $resultPath) -and (Get-Date) -lt $deadline) {
              if ($hostProcess.HasExited) {
                throw "WPF host exited early with code $($hostProcess.ExitCode)"
              }
              Start-Sleep -Seconds 1
            }

            if (-not (Test-Path $resultPath)) {
              throw "Timed out waiting for WebView2/React render result."
            }

            $uiResult = Get-Content $resultPath -Raw | ConvertFrom-Json
            if ($uiResult.status -ne "ready") {
              throw "WPF/WebView2 UI smoke test failed: $($uiResult.error)"
            }
            if ($uiResult.rootChildren -lt 1 -or $uiResult.bodyTextLength -lt 1) {
              throw "React root is empty: $($uiResult | ConvertTo-Json -Compress)"
            }

            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()

            if ((Get-Item $screenshotPath).Length -lt 10000) {
              throw "UI screenshot is unexpectedly small; graphical rendering may have failed."
            }

            Write-Host "WPF window launched and WebView2 rendered React UI: $($uiResult | ConvertTo-Json -Compress)"
            Write-Host "Screenshot saved: $screenshotPath"
          }
          finally {
            if (-not $hostProcess.HasExited) {
              Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue
            }
            Remove-Item Env:SYSTEMES_UI_SMOKE_RESULT -ErrorAction SilentlyContinue
          }

      - name: Upload Windows UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemes-windows-ui-smoke
          path: systemes-ui-smoke.png
          if-no-files-found: ignore
