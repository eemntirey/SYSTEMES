name: K2 PS2 keyboard and mouse QEMU integration

on:
  pull_request:
    paths:
      - 'kernel/**'
      - 'scripts/qemu_ps2_input_test.py'
      - '.github/workflows/kernel-ps2-input.yml'
      - 'boot/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps2-input-qemu:
    name: QEMU PS/2 keyboard and mouse end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install QEMU and UEFI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnu-efi binutils dosfstools mtools xorriso qemu-system-x86 ovmf
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - name: Build input-test kernel
        run: |
          cargo rustc --manifest-path kernel/Cargo.toml --release --target x86_64-unknown-none --features qemu-ps2-input-test --bin systemes-kernel -- -C relocation-model=static -C link-arg=-Tlinker.ld
          mkdir -p build/uefi
          objcopy -O binary kernel/target/x86_64-unknown-none/release/systemes-kernel build/uefi/KERNEL.BIN
          test -s build/uefi/KERNEL.BIN
          kernel_end=$(nm -n kernel/target/x86_64-unknown-none/release/systemes-kernel | awk '$3 == "__kernel_image_end" { print "0x" $1 }')
          test -n "$kernel_end"
          kernel_image_bytes=$((kernel_end - 0x00200000))
          test "$kernel_image_bytes" -ge "$(stat -c %s build/uefi/KERNEL.BIN)"
          echo "KERNEL_IMAGE_BYTES=$kernel_image_bytes" >> "$GITHUB_ENV"
      - name: Build GNU-EFI loader and bootable ISO
        run: |
          gcc -g -O0 -DKERNEL_IMAGE_BYTES=$KERNEL_IMAGE_BYTES -I/usr/include/efi -I/usr/include/efi/x86_64 -DEFI_FUNCTION_WRAPPER -fpic -ffreestanding -fno-stack-protector -fno-stack-check -fshort-wchar -mno-red-zone -maccumulate-outgoing-args -c boot/uefi-loader/main.c -o build/uefi/loader.o
          ld -nostdlib -znocombreloc -T /usr/lib/elf_x86_64_efi.lds -shared -Bsymbolic /usr/lib/crt0-efi-x86_64.o build/uefi/loader.o -L/usr/lib -lefi -lgnuefi -o build/uefi/loader.so
          objcopy -j .text -j .sdata -j .data -j .rodata -j .dynamic -j .dynsym -j .rel -j .rela -j .reloc -O efi-app-x86_64 build/uefi/loader.so build/uefi/BOOTX64.EFI
          truncate -s 16M build/uefi/esp.img
          mkfs.vfat build/uefi/esp.img
          mmd -i build/uefi/esp.img ::/EFI ::/EFI/BOOT
          mcopy -i build/uefi/esp.img build/uefi/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/uefi/esp.img build/uefi/KERNEL.BIN ::/EFI/BOOT/KERNEL.BIN
          mkdir -p build/uefi/iso-root/EFI/BOOT
          cp build/uefi/BOOTX64.EFI build/uefi/iso-root/EFI/BOOT/BOOTX64.EFI
          cp build/uefi/KERNEL.BIN build/uefi/iso-root/EFI/BOOT/KERNEL.BIN
          cp build/uefi/esp.img build/uefi/iso-root/esp.img
          xorriso -as mkisofs -R -J -V SYSTEMES-PS2-INPUT -o build/uefi/systemes-ps2-input.iso -e esp.img -no-emul-boot build/uefi/iso-root
          test -s build/uefi/systemes-ps2-input.iso
      - name: Boot QEMU and inject PS/2 input over QMP
        shell: bash
        run: |
          firmware="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          variables="$(find /usr/share/OVMF -maxdepth 1 -type f -name 'OVMF_VARS*.fd' | sort | head -n 1)"
          test -n "$firmware"
          test -n "$variables"
          cp "$variables" build/uefi/OVMF_VARS.fd
          qmp_socket="$RUNNER_TEMP/systemes-qmp.sock"
          rm -f "$qmp_socket"
          qemu-system-x86_64 -machine q35 -m 512M \
            -drive if=pflash,format=raw,unit=0,readonly=on,file="$firmware" \
            -drive if=pflash,format=raw,unit=1,file=build/uefi/OVMF_VARS.fd \
            -drive file=build/uefi/systemes-ps2-input.iso,media=cdrom,if=ide,readonly=on \
            -boot order=d -serial file:build/uefi/serial.log \
            -debugcon file:build/uefi/debug.log -global isa-debugcon.iobase=0xe9 \
            -qmp unix:"$qmp_socket",server=on,wait=off -display none -no-reboot -no-shutdown &
          qemu_pid=$!
          cleanup() { kill "$qemu_pid" 2>/dev/null || true; wait "$qemu_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          python3 scripts/qemu_ps2_input_test.py --socket "$qmp_socket" --debug-log build/uefi/debug.log
      - name: Upload QEMU input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: systemes-ps2-input-qemu-evidence
          path: |
            build/uefi/systemes-ps2-input.iso
            build/uefi/serial.log
            build/uefi/debug.log
          if-no-files-found: warn
